<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <title>marta-m - Portfolio</title>
    <link rel="icon" type="image/png" href="img/1-favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--primary);
            overflow: hidden;
            height: 100vh;
        }
        
        /* Header normal (navbar) - fixo no topo */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1030;
            background-color: var(--primary);
            padding: 0.8rem 0;
        }
        
        /* Scroll container */
        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        
        /* Cada slide/photo */
        .photo-full {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
            background-color: var(--primary);
            position: relative;
        }
        
        /* Imagem */
        .photo-full img {
            max-width: 100%;
            max-height: calc(100vh - 80px);
            width: auto;
            height: auto;
            object-fit: contain;
        }
        
        /* Info flutuante no canto */
        .photo-info-scroll {
            position: fixed;
            top: 80px;
            left: 2rem;
            z-index: 10;
            max-width: 350px;
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-radius: 4px;
            border-left: 2px solid var(--orange);
            pointer-events: none;
        }
        
        .photo-info-scroll h1 {
            font-size: 1.2rem;
            margin-bottom: 0.25rem;
            font-weight: 400;
            letter-spacing: 0.05rem;
        }
        
        .photo-info-scroll p {
            font-size: 0.8rem;
            margin-bottom: 0;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .photo-info-scroll {
                top: 70px;
                left: 1rem;
                right: 1rem;
                max-width: none;
                padding: 0.8rem 1rem;
            }
            
            .photo-info-scroll h1 {
                font-size: 1rem;
            }
            
            .photo-info-scroll p {
                font-size: 0.7rem;
            }
            
            .photo-full img {
                max-height: calc(100vh - 100px);
            }
        }
    </style>
</head>

<body>
    <!-- Header normal (navbar) - sem Home -->
     <nav class="navbar navbar-expand navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img class="logo" src="img/logo-white.png" alt="marta-m">
            </a>
            <div class="navbar-dark" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                        <span class="nav-underline"></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="design.html">Design</a>
                        <span class="nav-underline"></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="photography.html">Photography</a>
                        <span class="nav-underline"></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                        <span class="nav-underline"></span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Info flutuante -->
    <div class="photo-info-scroll">
        <h1>Postcard Collection</h1>
        <p>Automotive photography meets graphic design</p>
    </div>

    <!-- Scroll container -->
    <div class="scroll-container">
        <div class="photo-full">
            <img src="img/photography/IMG_2090.jpg" alt="Postcard 1">
        </div>
        <div class="photo-full">

        </div>
        <div class="photo-full">
            <img src="img/photography/DSC02606.jpg" alt="Postcard 3">

        <div class="photo-full">

        <div class="photo-full">

        </div>
        <div class="photo-full">

        </div>
    </div>
</body>
</html>
