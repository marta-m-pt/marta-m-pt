<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <title>marta-m - Portfolio</title>
    <link rel="icon" type="image/png" href="img/1-favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--primary);
        }
        
        /* Menu no topo */
        .navbar-brand img{
            max-height: 1.5rem;
        }
        .top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            z-index: 100;
            background: transparent;
        }
        
        .menu-logo img {
            max-height: 1.5rem;
        }
        
        .menu-links {
            display: flex;
            gap: 2rem;
        }
        
        .menu-links a {
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.1rem;
            transition: color 0.3s ease;
        }
        
        .menu-links a:hover {
            color: var(--orange);
        }
        
        /* Slideshow */
        .slideshow-container {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        /* Overlay escuro para melhor contraste */
        .slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        
        /* Texto central */
        .hero-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            color: white;
            width: 100%;
            padding: 0 2rem;
        }
        
        .hero-title {
            font-size: 4rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            margin-bottom: 0.5rem;
        }
        
        .hero-subtitle {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.3rem;
            opacity: 0.8;
        }
        
        /* Dots indicadores */
        .dots {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            z-index: 10;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .dot.active {
            background: var(--orange);
        }
        
        @media (max-width: 768px) {
            .top-menu {
                padding: 1rem;
            }
            
            .menu-links {
                gap: 1rem;
            }
            
            .menu-links a {
                font-size: 0.7rem;
            }
            
            .hero-title {
                font-size: 2rem;
                letter-spacing: 0.1rem;
            }
            
            .hero-subtitle {
                font-size: 0.7rem;
                letter-spacing: 0.15rem;
            }
        }
    </style>
</head>

<body>
    <!-- Menu no topo -->
    <div class="top-menu">
        <a class="navbar-brand" href="index.html">
                <img class="logo" src="img/logo-white.png" alt="marta-m">
            </a>
        <div class="menu-links">
            <a href="design.html">Design</a>
            <a href="photography.html">Photography</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
        </div>
    </div>

    <!-- Slideshow -->
    <div class="slideshow-container">
        <div class="slide active" style="background-image: url('img/design/campeonato-nacional-de-velocidade/key-visual-3.jpg');"></div>
        <div class="slide" style="background-image: url('img/photography/cnv-2026-DSC01094.jpg');"></div>
        <div class="slide" style="background-image: url('img/design/ai-in-design/research-editorial-index.jpg');"></div>
        <div class="slide" style="background-image: url('img/photography/cfmoto-dsc06406.jpg');"></div>
        <div class="slide" style="background-image: url('img/design/n-8/n8-capa.jpg');"></div>
        <div class="slide" style="background-image: url('img/photography/koenigsegg-_dsc4975.jpg');"></div>
        
        
        <div class="dots">
            <div class="dot active" data-slide="0"></div>
            <div class="dot" data-slide="1"></div>
            <div class="dot" data-slide="2"></div>
            <div class="dot" data-slide="3"></div>
            <div class="dot" data-slide="4"></div>
            <div class="dot" data-slide="5"></div>
        </div>
    </div>

    <script>
        // Slideshow automático
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = slides.length;
        
        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            currentSlide = index;
        }
        
        function nextSlide() {
            let next = (currentSlide + 1) % totalSlides;
            showSlide(next);
        }
        
        // Auto slide a cada 3 segundos
        let slideInterval = setInterval(nextSlide, 3000);
        
        // Clicar nos dots
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                clearInterval(slideInterval);
                showSlide(index);
                slideInterval = setInterval(nextSlide, 3000);
            });
        });
    </script>
</body>
</html>
